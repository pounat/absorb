name: All Platforms Release

# Mirrors the `all-release` workflow in codemagic.yaml. Triggered manually via
# `gh workflow run all-release.yml` or the Actions UI. Builds the github-flavor
# APK, the playstore-flavor AAB, and the iOS IPA, uploads all three to the
# GitHub draft release, and pushes the IPA to TestFlight.
#
# These run in PARALLEL: a `prepare` job creates the draft up front, then the
# two Android flavors (matrix, on ubuntu) and the iOS IPA (on macOS) build at
# the same time and each upload their own artifact to that draft. Wall-clock is
# the slower of Android/iOS rather than their sum. F-Droid is intentionally not
# built here — F-Droid's own servers build it from the tagged source.

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Pre-release? Uploads to a per-build v<version>-<build> tag, marks it prerelease, adds -pre to the filenames"
        required: false
        type: boolean
        default: false
      beta_test_notes:
        description: "What to Test (TestFlight notes, optional)"
        required: false
        type: string
      beta_group:
        description: "TestFlight beta group (e.g. Early Absorbers)"
        required: false
        type: string
        default: ""

# Every job that touches the release needs write access to Releases.
permissions:
  contents: write

jobs:
  # Fast ubuntu job: compute the version/tag and create the draft release before
  # the parallel build jobs start, so they only ever `upload --clobber` into an
  # existing draft and never race to create one with conflicting flags.
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      fname: ${{ steps.version.outputs.fname }}
      pre: ${{ steps.version.outputs.pre }}
      raw: ${{ steps.version.outputs.raw }}
    steps:
      - uses: actions/checkout@v5

      - name: Read pubspec version
        id: version
        env:
          PRE: ${{ inputs.prerelease }}
        run: |
          RAW=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          VERSION_NAME="${RAW%%+*}"
          BUILD="${RAW##*+}"
          # Unified artifact basename: dash (URL-safe, unlike +) between version
          # and build number, plus a -pre suffix for prereleases.
          BASE="absorb-${RAW//+/-}"
          if [ "$PRE" = "true" ]; then
            # Per-build tag: Obtainium and the in-app updater key on the tag,
            # so each beta build needs its own. Finals keep the clean tag,
            # which is also the only shape F-Droid's checkupdates matches.
            echo "tag=v${VERSION_NAME}-${BUILD}" >> "$GITHUB_OUTPUT"
            echo "fname=${BASE}-pre" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VERSION_NAME}" >> "$GITHUB_OUTPUT"
            echo "fname=${BASE}" >> "$GITHUB_OUTPUT"
          fi
          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
          echo "pre=$PRE" >> "$GITHUB_OUTPUT"

      - name: Create draft release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          PRE: ${{ steps.version.outputs.pre }}
        run: |
          if gh release view "$VERSION_TAG" &>/dev/null; then
            IS_DRAFT=$(gh release view "$VERSION_TAG" --json isDraft -q .isDraft)
            IS_PRE=$(gh release view "$VERSION_TAG" --json isPrerelease -q .isPrerelease)
            if [ "$IS_DRAFT" = "false" ] && [ "$IS_PRE" = "false" ]; then
              echo "Refusing: $VERSION_TAG is a published full release. Bump the build number or mark it a draft first."
              exit 1
            fi
            echo "Release $VERSION_TAG already exists - artifacts will be added to it."
          else
            CREATE_ARGS=(--draft --title "$VERSION_TAG" --notes "# $VERSION_TAG")
            [ "$PRE" = "true" ] && CREATE_ARGS+=(--prerelease)
            gh release create "$VERSION_TAG" "${CREATE_ARGS[@]}" < /dev/null
          fi

      - name: Notify Discord (build started)
        if: env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ steps.version.outputs.raw }}
          RUN_URL: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        run: |
          curl -sS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"Build started\",\"description\":\"**All Platforms Release** v$VERSION\\n[Build log]($RUN_URL)\",\"color\":3447003}]}" \
            > /dev/null 2>&1 || true

  # Two parallel ubuntu jobs (github APK, playstore AAB). Android doesn't need
  # macOS, so these are fast + cheap and run alongside the iOS job below.
  android:
    name: Android (${{ matrix.flavor }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: github
            build_type: apk
            define: GITHUB_BUILD=true
            out_dir: build/app/outputs/apk/github/release
            ext: apk
          - flavor: playstore
            build_type: appbundle
            define: PLAYSTORE_BUILD=true
            out_dir: build/app/outputs/bundle/playstoreRelease
            ext: aab
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/absorb-upload-key.jks"
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$RUNNER_TEMP/absorb-upload-key.jks
          EOF

      - name: Build universal and split GitHub APKs
        if: matrix.flavor == 'github'
        run: bash scripts/build-github-apks

      - name: Build ${{ matrix.flavor }}
        if: matrix.flavor != 'github'
        run: flutter build ${{ matrix.build_type }} --release --flavor ${{ matrix.flavor }} --dart-define=${{ matrix.define }}

      - name: Rename artifact
        env:
          FNAME: ${{ needs.prepare.outputs.fname }}
          OUT_DIR: ${{ matrix.out_dir }}
          EXT: ${{ matrix.ext }}
          PRE: ${{ needs.prepare.outputs.pre }}
        run: |
          if [ "${{ matrix.flavor }}" = "github" ]; then
            if [ "$PRE" = "true" ]; then
              for apk in "$OUT_DIR"/*.apk; do
                mv "$apk" "${apk%.apk}-pre.apk"
              done
            fi
          else
            SRC=$(ls "$OUT_DIR"/*.$EXT | head -1)
            DST="$OUT_DIR/${FNAME}.${EXT}"
            [ "$SRC" = "$DST" ] || mv "$SRC" "$DST"
            echo "ARTIFACT=$DST" >> "$GITHUB_ENV"
          fi

      - name: Upload to GitHub draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ needs.prepare.outputs.tag }}
          OUT_DIR: ${{ matrix.out_dir }}
        run: |
          if [ "${{ matrix.flavor }}" = "github" ]; then
            shopt -s nullglob
            UNIVERSAL=("$OUT_DIR"/*-universal*.apk)
            ALL_APKS=("$OUT_DIR"/*.apk)
            [ "${#UNIVERSAL[@]}" -eq 1 ] || { echo "Universal APK missing"; exit 1; }
            gh release upload "$VERSION_TAG" "${UNIVERSAL[0]}" --clobber
            for apk in "${ALL_APKS[@]}"; do
              [ "$apk" = "${UNIVERSAL[0]}" ] && continue
              gh release upload "$VERSION_TAG" "$apk" --clobber
            done
          else
            gh release upload "$VERSION_TAG" "$ARTIFACT" --clobber
          fi

      # Park the AAB in Play Console as an internal-track DRAFT (nothing
      # submitted or rolled out). Skips silently if the secret isn't set.
      - name: Upload AAB to Play Console (internal, draft)
        if: matrix.flavor == 'playstore' && env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.barnabas.absorb
          releaseFiles: ${{ env.ARTIFACT }}
          track: internal
          status: draft

  # iOS must build on macOS; runs in parallel with the Android jobs above.
  ios:
    name: iOS IPA + TestFlight
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      BUNDLE_ID: com.barnabas.absorb
      APPLE_TEAM_ID: 3W9C9PWP64
    steps:
      - uses: actions/checkout@v5

      # Apple requires Xcode 26+ / iOS 26 SDK for App Store uploads. Pick the
      # newest Xcode installed on the runner.
      - name: Select latest Xcode
        run: |
          LATEST_XCODE=$(ls /Applications/ | grep -E '^Xcode_[0-9]+(\.[0-9]+)?(\.app)?$' | sort -V | tail -1)
          echo "Available Xcodes:"
          ls /Applications/ | grep -E '^Xcode' || true
          echo "Selecting: $LATEST_XCODE"
          sudo xcode-select -s "/Applications/$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install codemagic-cli-tools
        run: pipx install codemagic-cli-tools

      - name: Initialise temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: keychain initialize

      - name: Fetch signing files via App Store Connect API
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
        run: |
          # Fetch signing files for every bundle ID this project ships:
          # main app + NowPlayingWidget extension.
          for BID in "$BUNDLE_ID" "$BUNDLE_ID.NowPlayingWidget"; do
            app-store-connect fetch-signing-files "$BID" \
              --type IOS_APP_STORE \
              --create
          done
          keychain add-certificates

          # Mirror profiles into both possible Xcode lookup paths regardless
          # of where codemagic-cli-tools dropped them.
          NEW_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          OLD_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$NEW_DIR" "$OLD_DIR"
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            cp -v "$p" "$NEW_DIR/" || true
            cp -v "$p" "$OLD_DIR/" || true
          done < <(find "$HOME" "$RUNNER_TEMP" "$GITHUB_WORKSPACE" /tmp -name '*.mobileprovision' 2>/dev/null)

          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Build iOS IPA
        run: flutter build ipa --release --export-options-plist=$HOME/export_options.plist

      - name: Rename IPA
        env:
          FNAME: ${{ needs.prepare.outputs.fname }}
        run: |
          IPA_SRC=$(ls build/ios/ipa/*.ipa | head -1)
          mv "$IPA_SRC" "build/ios/ipa/${FNAME}.ipa"

      - name: Upload IPA to GitHub draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$VERSION_TAG" build/ios/ipa/*.ipa --clobber

      # Upload the IPA to TestFlight but DO NOT submit it for beta review. The
      # build still lands in TestFlight (available to internal testers) once Apple
      # finishes processing. We drop the `--testflight` flag on purpose: that flag
      # also submits the build for external beta review, which Apple rejects with a
      # 422 ("Another build is in review") whenever an earlier build in the same
      # version train is still in review, failing the whole run even though the
      # upload itself succeeded. External beta review / group assignment is handled
      # by the opt-in best-effort step below (pass `beta_group`), or done by hand in
      # App Store Connect.
      - name: Upload to TestFlight (no beta-review submission)
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -1)
          app-store-connect publish --path "$IPA_PATH"

      # Notes + beta-group assignment happen after Apple processes the build.
      # They commonly fail with a timeout even when the upload itself worked,
      # so we run them in a separate best-effort step.
      - name: Add TestFlight notes / beta group (best-effort)
        if: inputs.beta_test_notes != '' || inputs.beta_group != ''
        continue-on-error: true
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BETA_TEST_NOTES: ${{ inputs.beta_test_notes }}
          BETA_GROUP: ${{ inputs.beta_group }}
        run: |
          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -1)
          ARGS=(--path "$IPA_PATH" --testflight --skip-package-upload)
          if [ -n "$BETA_TEST_NOTES" ]; then
            echo "  + TestFlight notes ($(printf '%s' "$BETA_TEST_NOTES" | wc -c) chars)"
            ARGS+=(--whats-new "$BETA_TEST_NOTES" --locale en-US)
          fi
          if [ -n "$BETA_GROUP" ]; then
            echo "  + Beta group: $BETA_GROUP"
            ARGS+=(--beta-group "$BETA_GROUP")
          fi
          app-store-connect publish "${ARGS[@]}"

  # Single Discord ping once both halves finish, success or fail.
  notify:
    name: Notify Discord (finished)
    needs: [prepare, android, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord (build finished)
        if: env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ needs.prepare.outputs.raw }}
          RUN_URL: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
          ANDROID_RESULT: ${{ needs.android.result }}
          IOS_RESULT: ${{ needs.ios.result }}
        run: |
          if [ "$ANDROID_RESULT" = "success" ] && [ "$IOS_RESULT" = "success" ]; then
            TITLE="Build successful"
            COLOR=3066993
          else
            TITLE="Build failed"
            COLOR=15158332
          fi
          curl -sS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"$TITLE\",\"description\":\"**All Platforms Release** v$VERSION (android: $ANDROID_RESULT, ios: $IOS_RESULT)\\n[Build log]($RUN_URL)\",\"color\":$COLOR}]}" \
            > /dev/null 2>&1 || true

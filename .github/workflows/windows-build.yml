name: Windows Desktop Build

# Builds the Windows desktop app from whichever branch the run is started on
# and packs it into an installer (windows/installer/absorb.iss). Nothing is
# signed and nothing goes to a release: download the artifact from the run
# page and run the setup exe inside it. It installs per-user, adds a Start
# menu entry and an uninstaller, and updates an existing install in place.

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Windows app
    # windows-latest is the VS 2026 image, whose STL turns the deprecated
    # <experimental/coroutine> include in flutter_inappwebview_windows and
    # permission_handler_windows into a hard error. VS 2022 only warns.
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Read version
        id: version
        shell: bash
        run: |
          full=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | tr -d '\r')
          echo "name=absorb-${full/+/-}-windows-setup" >> "$GITHUB_OUTPUT"
          # Inno wants a numeric version: 1.11.1+286 -> 1.11.1.286
          echo "numeric=${full/+/.}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: flutter build windows --release

      # The installed app needs the VC++ runtime next to the exe on machines
      # that never installed the redistributable.
      - name: Add the VC++ runtime DLLs
        shell: pwsh
        run: |
          $out = "build\windows\x64\runner\Release"
          $crt = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" -Directory -ErrorAction SilentlyContinue | Select-Object -Last 1
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            $src = if ($crt) { Join-Path $crt.FullName $dll } else { "C:\Windows\System32\$dll" }
            if (-not (Test-Path $src)) { $src = "C:\Windows\System32\$dll" }
            Copy-Item $src $out
          }
          Get-ChildItem $out | Select-Object Name, Length

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.numeric }}" `
            "/DOutputBase=${{ steps.version.outputs.name }}" `
            windows\installer\absorb.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem build\installer | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: build/installer/${{ steps.version.outputs.name }}.exe
          if-no-files-found: error
          retention-days: 14

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    client_max_body_size 64k;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $web_api http://web-api:3000;

    # Hash pins the existing upstream loading-shell inline script, not arbitrary JS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-OGX3UM76Il1y79aeKyTBL3I7orZSeHZadvWy7yI7xPA='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = / { return 302 /absorb/; }
    location = /healthz { default_type text/plain; return 200 'ok'; }
    location = /absorb { return 308 /absorb/; }
    location ^~ /absorb/ {
        try_files $uri $uri/ /absorb/index.html;
        expires -1;
    }
    location = /source/absorb-web-source.tar.gz {
        default_type application/gzip;
        expires -1;
    }
    location = /source/LICENSE {
        default_type text/plain;
        expires -1;
    }
    location / {
        # Fixed internal BFF only. The BFF owns authentication, route/URL checks,
        # permission filtering, progress ordering, and all origin credentials.
        proxy_pass $web_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 30s;
        proxy_intercept_errors off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
    }
}
